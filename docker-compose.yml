version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: journal-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journal_platform
    ports:
      - "5432:5432"
    volumes:
      - journal_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journal_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  journal_platform_pgdata:
